services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: steamtracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-steam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-steamtracker}
    ports:
      # host:container — 5433 on the host avoids clashing with any
      # Postgres you may already have installed locally.
      - "5433:5432"
    volumes:
      # Named volume = your data survives `docker compose down`.
      - steam_pgdata:/var/lib/postgresql/data
      # Anything in this folder runs ONCE, on first startup of an empty
      # volume. Good for creating the extension + initial tables.
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-steam} -d ${POSTGRES_DB:-steamtracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  steam_pgdata:
